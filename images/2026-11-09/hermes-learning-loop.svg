<rect class="capbg" x="0" y="430" width="1080" height="86"/>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">How Hermes Agent keeps what it learns<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0433;0.0500;1.0000" values="1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">A message arrives from a chat app or the terminal<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0497;0.0600;0.1100;0.1167;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The gateway hands it to the agent as a turn<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.1163;0.1267;0.1933;0.2000;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The loop calls the model and runs its tool calls<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.1997;0.2100;0.2767;0.2833;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Tool results go back to the model until it answers<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.2830;0.2933;0.3933;0.4000;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">After the turn, a forked copy reviews the conversation<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.3997;0.4100;0.4933;0.5000;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Facts about you and the setup go to two small files<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.4997;0.5100;0.5933;0.6000;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">How to do a kind of task goes into a skill<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.5997;0.6100;0.6933;0.7000;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Both reach the system prompt only at the next session<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.6997;0.7100;0.8267;0.8333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="1">The prompt never changes mid-session, so the cache holds<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.8330;0.8433;0.9733;0.9800;1.0000" values="0;0;1;1;0;0"/></text>
<rect class="track" x="0" y="534" width="1080" height="6"/>
<rect class="bar" x="0" y="534" width="0" height="6"><animate attributeName="width" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;1.0000" values="0;1080"/></rect>
</svg>