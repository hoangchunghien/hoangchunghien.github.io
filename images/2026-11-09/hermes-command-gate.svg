<rect class="capbg" x="0" y="430" width="1080" height="86"/>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Where a risky command stops in Hermes Agent<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.0464;0.0536;1.0000" values="1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The model asks the terminal tool to run a command<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.0532;0.0643;0.1179;0.1250;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Hard floor first: some commands are never allowed<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.1246;0.1357;0.2071;0.2143;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">In smart mode, a second model rates the risk<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.2139;0.2250;0.2964;0.3036;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Low risk: it runs, approved for this command only<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.3032;0.3143;0.4036;0.4107;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Unsure: you get Approve and Deny buttons on Telegram<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.4104;0.4214;0.5107;0.5179;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Approve, and it runs<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.5175;0.5286;0.6179;0.6250;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Deny, no answer in 300 seconds, or high risk: blocked<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.6246;0.6357;0.7250;0.7321;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">A hardline match is blocked without asking, even in yolo mode<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.7318;0.7429;0.8321;0.8393;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="1">Cron jobs have nobody to ask, so they deny by default<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.8389;0.8500;0.9714;0.9786;1.0000" values="0;0;1;1;0;0"/></text>
<rect class="track" x="0" y="534" width="1080" height="6"/>
<rect class="bar" x="0" y="534" width="0" height="6"><animate attributeName="width" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;1.0000" values="0;1080"/></rect>
</svg>