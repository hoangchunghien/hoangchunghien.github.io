<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-label="Animated: a shell command meets the hard floor, then a guardian model; low risk runs, uncertain asks you on Telegram, deny or timeout blocks it, and a hardline match is blocked without asking.">
<style>
svg{--bg:#ffffff;--ink:#1d2733;--sub:#4a5866;--dim:#c9d1da;--packet:#2f6fb2;--cap:#f1f4f8;
--agent-f:#dae8fc;--agent-s:#6c8ebf;--file-f:#fff2cc;--file-s:#d6b656;--tg-f:#e1f5fe;--tg-s:#0288d1;
--you-f:#d5e8d4;--you-s:#82b366;--pub-f:#f8cecc;--pub-s:#b85450;--ext-f:#f5f5f5;--ext-s:#666666}
@media (prefers-color-scheme:dark){svg{--bg:#121820;--ink:#e6ebf1;--sub:#a9b6c3;--dim:#3a4652;--packet:#7fb0e6;--cap:#1b232d;
--agent-f:#1e2b3d;--file-f:#33301a;--tg-f:#10303d;--you-f:#1d3320;--pub-f:#3d2222;--ext-f:#24282d;--ext-s:#9aa3ad}}
.bg{fill:var(--bg)} .t{fill:var(--ink);font:600 16px Helvetica,Arial,sans-serif} .s{fill:var(--sub);font:13px Helvetica,Arial,sans-serif}
.cap{fill:var(--ink);font:600 19px Helvetica,Arial,sans-serif} .capbg{fill:var(--cap)}
.dim{stroke:var(--dim);stroke-width:2;fill:none} .live{stroke:var(--packet);stroke-width:2.5;fill:none}
.badge{fill:var(--bg);stroke:var(--packet);stroke-width:1.5} .bt{fill:var(--packet);font:700 12px Helvetica,Arial,sans-serif}
.leg{font:13px Helvetica,Arial,sans-serif;fill:var(--ink)} .bar{fill:var(--packet)} .track{fill:var(--dim)}
.agent{fill:var(--agent-f);stroke:var(--agent-s)}.file{fill:var(--file-f);stroke:var(--file-s)}.tg{fill:var(--tg-f);stroke:var(--tg-s)}.you{fill:var(--you-f);stroke:var(--you-s)}.pub{fill:var(--pub-f);stroke:var(--pub-s)}.ext{fill:var(--ext-f);stroke:var(--ext-s)}
@media (prefers-reduced-motion:reduce){animate,animateMotion{display:none}}
</style>
