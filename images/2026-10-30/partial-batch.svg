<rect class="capbg" x="0" y="430" width="1080" height="86"/>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">One bad message should not replay the whole batch<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0433;0.0500;1.0000" values="1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Lambda hands your function a batch of SQS messages<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0497;0.0600;0.1267;0.1333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Message 3 fails; the other four were fine<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.1330;0.1433;0.2267;0.2333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">If the function throws, Lambda treats the whole batch as failed<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.2330;0.2433;0.3267;0.3333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">All five return to the queue, and four of them run twice<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.3330;0.3433;0.4600;0.4667;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Turn on ReportBatchItemFailures for the event source mapping<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.4663;0.4767;0.5433;0.5500;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The handler catches per message and returns the failed IDs<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.5497;0.5600;0.6267;0.6333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Lambda deletes the messages that succeeded<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.6330;0.6433;0.7100;0.7167;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Only message 3 comes back and is retried on its own<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.7163;0.7267;0.8100;0.8167;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="1">Return failures, do not throw. Only the failures run twice.<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.8163;0.8267;0.9733;0.9800;1.0000" values="0;0;1;1;0;0"/></text>
