<g opacity="0.55"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.8333;0.8467;0.9800;0.9967;1.0000" values="0.55;0.55;1;1;0.55;0.55"/><rect class="agent" x="300" y="360" width="210" height="32" rx="8" stroke-width="1.5"/><text class="leg" x="405.0" y="381" text-anchor="middle">Lambda</text></g>
