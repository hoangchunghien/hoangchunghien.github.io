<animate attributeName="stroke-width" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.5333;0.5433;0.6333;0.6433;1.0000" values="1.5;1.5;4;4;1.5;1.5"/></rect>
<text class="t" x="665.0" y="282.0" text-anchor="middle">Same message, again</text>
<text class="s" x="665.0" y="302.0" text-anchor="middle">your code runs twice</text>
</g>
<g opacity="1">
<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.6333;0.6467;0.9800;0.9967;1.0000" values="0.22;0.22;1;1;0.22;0.22"/>
