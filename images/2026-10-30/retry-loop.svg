<text class="t" x="405.0" y="282.0" text-anchor="middle">Receive count passes</text>
<text class="s" x="405.0" y="302.0" text-anchor="middle">maxReceiveCount</text>
</g>
<g opacity="1">
<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.7333;0.7467;0.9800;0.9967;1.0000" values="0.22;0.22;1;1;0.22;0.22"/>
