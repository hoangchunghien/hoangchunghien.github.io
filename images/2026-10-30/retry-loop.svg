<text class="s" x="925.0" y="302.0" text-anchor="middle">visible again, receive 2</text>
</g>
<g opacity="1">
<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.5333;0.5467;0.9800;0.9967;1.0000" values="0.22;0.22;1;1;0.22;0.22"/>
