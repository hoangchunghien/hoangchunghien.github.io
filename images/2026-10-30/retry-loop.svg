<g opacity="0.55"><animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.8333;0.8467;0.9800;0.9967;1.0000" values="0.55;0.55;1;1;0.55;0.55"/><rect class="you" x="820" y="360" width="210" height="32" rx="8" stroke-width="1.5"/><text class="leg" x="925.0" y="381" text-anchor="middle">Safe place</text></g>
<rect class="capbg" x="0" y="430" width="1080" height="86"/>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Why a queue consumer runs the same message twice<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0433;0.0500;1.0000" values="1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">A standard SQS queue delivers each message at least once<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0497;0.0600;0.1267;0.1333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Lambda receives a batch; SQS hides it, it does not delete it<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.1330;0.1433;0.2267;0.2333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The handler throws, or runs past its timeout<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.2330;0.2433;0.3267;0.3333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Nothing deleted the message, so it is still in the queue<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.3330;0.3433;0.4267;0.4333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">When the visibility timeout ends, it is visible again<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.4330;0.4433;0.5267;0.5333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Your code runs again on the same message<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.5330;0.5433;0.6267;0.6333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">After maxReceiveCount receives, the redrive policy steps in<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.6330;0.6433;0.7267;0.7333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">It moves to the dead-letter queue, kept for a replay<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.7330;0.7433;0.8267;0.8333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="1">Retries are built in. Making them safe is your job.<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.8330;0.8433;0.9733;0.9800;1.0000" values="0;0;1;1;0;0"/></text>
<rect class="track" x="0" y="534" width="1080" height="6"/>
<rect class="bar" x="0" y="534" width="0" height="6"><animate attributeName="width" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;1.0000" values="0;1080"/></rect>
</svg>