<rect class="capbg" x="0" y="430" width="1080" height="86"/>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">A real quote under a wrong sentence<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.0464;0.0536;1.0000" values="1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">A trap: the corpus does not answer this<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.0532;0.0643;0.1179;0.1250;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The retriever still returns its best passages<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.1246;0.1357;0.2071;0.2143;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The model names a PEP anyway<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.2139;0.2250;0.3143;0.3214;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Its quote is real, so a quote check alone would pass<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.3211;0.3321;0.4393;0.4464;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">But the number it names is not in that passage<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.4461;0.4571;0.5643;0.5714;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">So the claim is cut<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.5711;0.5821;0.6714;0.6786;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The honest answer is the one left<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.6782;0.6893;0.7964;0.8036;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="1">A citation alone would have looked fine<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.8032;0.8143;0.9714;0.9786;1.0000" values="0;0;1;1;0;0"/></text>
