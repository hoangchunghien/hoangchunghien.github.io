<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-label="Animated: asked which PEP introduced asyncio, a question the 40 PEPs do not answer, a 3B model claimed PEP 492 and quoted real text from the passage it cited. The quote check passed, but the number 492 is not in that passage, so the claim was cut and the answer became: the documents I was given do not answer this.">
