<rect class="capbg" x="0" y="430" width="1080" height="86"/>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">A citation you can check, sentence by sentence<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0433;0.0500;1.0000" values="1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">A question comes in<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.0497;0.0600;0.1100;0.1167;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The retriever numbers the passages it found<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.1163;0.1267;0.1933;0.2000;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The model must answer in claims<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.1997;0.2100;0.2767;0.2833;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Each claim copies a quote from the passage it cites<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.2830;0.2933;0.3767;0.3833;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Code looks for that quote in that passage. No model.<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.3830;0.3933;0.4933;0.5000;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Found: the sentence stays, with its quote<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.4997;0.5100;0.5933;0.6000;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">Not found: the sentence is cut from the answer<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.5997;0.6100;0.6933;0.7000;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="0">The reader sees each quote highlighted in its source<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.6997;0.7100;0.8267;0.8333;1.0000" values="0;0;1;1;0;0"/></text>
<text class="cap" x="540.0" y="480" text-anchor="middle" opacity="1">Nothing left? "The documents do not answer this."<animate attributeName="opacity" dur="30.0s" repeatCount="indefinite" keyTimes="0.0000;0.8330;0.8433;0.9733;0.9800;1.0000" values="0;0;1;1;0;0"/></text>
